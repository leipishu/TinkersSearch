# ============================================================================
# Tinker's Search — Gradle Properties
# ============================================================================
#
# 本文件控制 Gradle 守护进程与构建的全局行为。
# This file controls the Gradle daemon and global build behavior.
#
# 完整文档 / Full documentation:
#   https://docs.gradle.org/current/userguide/build_environment.html
#
# 构建变体切换 / Build variant switching:
#   ./gradlew build                          # Full (with pinyin4j)
#   ./gradlew build -PincludePinyin4j=false  # Lite (without pinyin4j, -lite suffix)
#   ./gradlew buildAll                        # Both Full + Lite in one go
#
# 查看当前构建配置 / Inspect current build config:
#   ./gradlew buildInfo
#
# ============================================================================

# ----------------------------------------------------------------------------
# JVM 内存设置 / JVM memory settings
# ----------------------------------------------------------------------------
# Forge 1.18.2 反编译 Minecraft 源码需要较大堆内存；3G 是经过验证的最小推荐值。
# If you encounter OutOfMemoryError during decompilation, increase to 4G or 6G.
#
# Forge 1.18.2 decompiles Minecraft source which requires a large heap;
# 3G is the verified minimum. If you hit OutOfMemoryError, bump to 4G or 6G.
org.gradle.jvmargs=-Xmx3G

org.gradle.parallel=false
org.gradle.caching=false
tinkerssearch.version=1.6.0-beta
tinkerssearch.minecraft=1.18.2
tinkerssearch.forge=40.2.10
tinkerssearch.mantle=1.9.45
tinkerssearch.tconstruct=3.6.4.113
tinkerssearch.jei=9.7.1.255
tinkerssearch.pinyin4j=2.5.1

# ?? Gradle ???? JDK
org.gradle.java.installations.auto-download=false
# ???????? JDK 17
org.gradle.java.installations.paths=C:\\Program Files\\Java\\jdk-17