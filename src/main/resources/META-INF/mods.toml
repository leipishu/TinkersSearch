# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/leipishu/TinkersSearch/issues"
logoFile="logo.png"
description='''${mod_description}'''
authors="${mod_authors}"
version="${mod_version}"
displayName="${mod_name}"

[[mods]]
modId="tinkerssearch"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.tinkerssearch]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tinkerssearch]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tinkerssearch]]
modId="mantle"
mandatory=true
versionRange="[1.10.48,)"
ordering="NONE"
side="BOTH"

[[dependencies.tinkerssearch]]
modId="tconstruct"
mandatory=true
versionRange="[3.8.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.tinkerssearch]]
modId="jei"
mandatory=false
versionRange="[11.39.0,)"
ordering="NONE"
side="CLIENT"