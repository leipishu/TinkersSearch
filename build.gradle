buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
}

ext {
    minecraft_version = "1.18.2"
    mantle_build = "1.9.45"
    tinkers_build = "3.6.4.113"
}

apply plugin: 'net.minecraftforge.gradle'

version = '1.5.0'
group = 'top.leipishu.tinkerssearch'
archivesBaseName = 'tinkerssearch'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.18.2'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'tinkerssearch'

            mods {
                tinkerssearch {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'tinkerssearch'

            mods {
                tinkerssearch {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'tinkerssearch', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                tinkerssearch {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name 'DVS1 Maven FS'
        url 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        name 'Progwml6 JEI'
        url 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        name 'ModMaven'
        url 'https://modmaven.dev'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.18.2-40.2.10'

    implementation fg.deobf("slimeknights.mantle:Mantle:${minecraft_version}-${mantle_build}")
    implementation fg.deobf("slimeknights.tconstruct:TConstruct:${minecraft_version}-${tinkers_build}")

    // JEI - 可选依赖
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}:9.7.1.255:api")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}:9.7.1.255")
}

jar {
    manifest {
        attributes([
                "Specification-Title": "tinkerssearch",
                "Specification-Vendor": "tinkerssearch_sareus",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": "tinkerssearchsareus",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}